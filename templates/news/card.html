<article class="story-card"{% if not item.display_image %} data-image="none"{% endif %}>{% if item.display_image %}<a class="card-image" href="{{ item.get_absolute_url }}" tabindex="-1" aria-hidden="true">{% include 'news/image.html' %}</a>{% endif %}<a class="eyebrow" href="{{ item.category.get_absolute_url }}">{{ item.category.name }}</a><h3><a href="{{ item.get_absolute_url }}">{{ item.title }}</a></h3><p class="meta">{{ item.published_at|date:'j M Y' }} <span>·</span> {{ item.reading_minutes }} min read</p></article>
