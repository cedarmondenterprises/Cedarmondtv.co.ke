{% load static %}
<details class="share-destinations">
  <summary>More ways to share</summary>
  <ul>
    {% for label, url in destinations %}
      <li><a href="{{ url }}"><img src="{% static 'share-icons/'|add:label|lower|add:'.svg' %}" width="18" height="18" alt="">{{ label }}</a></li>
    {% endfor %}
  </ul>
</details>
