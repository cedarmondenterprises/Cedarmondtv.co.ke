{% load static %}
<details class="share-destinations">
  <summary aria-label="Share on other platforms" title="Share on other platforms">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="m8.7 10.5 6.6-3.8m-6.6 6.8 6.6 3.8"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="5" r="3"/><circle cx="18" cy="19" r="3"/>
    </svg>
  </summary>
  <ul>
    {% for label, url in destinations %}
      <li><a href="{{ url }}" aria-label="Share via {{ label }}" title="{{ label }}"><img src="{% static 'share-icons/'|add:label|lower|add:'.svg' %}" width="18" height="18" alt=""></a></li>
    {% endfor %}
  </ul>
</details>
