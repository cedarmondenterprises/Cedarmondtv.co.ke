name: Platform integration checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: pip-audit -r requirements.txt
  platform:
    runs-on: ubuntu-latest
    env:
      DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test integrations
      - run: NEWSROOM_2FA_REQUIRED=1 python manage.py test news.test_newsroom_2fa integrations.test_auth
      - run: python manage.py collectstatic --noinput
      - run: npm run test:a11y
      - run: cp .env.example .env && docker compose -f compose.yaml -f compose.public.yaml -f compose.distribution.yaml -f compose.integrations.yaml --profile jobs --profile search --profile monitoring config --quiet
