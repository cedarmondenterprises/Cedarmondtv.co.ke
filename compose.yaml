services:
  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    restart: unless-stopped
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz/',headers={'Host':'localhost','X-Forwarded-Proto':'https'}),timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [backend, edge]
  db:
    image: postgres:17-alpine
    env_file: .env
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [edge]
volumes:
  postgres:
  media:
  caddy_data:
  caddy_config:
networks:
  backend:
    internal: true
  edge:
