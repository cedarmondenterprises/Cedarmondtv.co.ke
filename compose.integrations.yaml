# Optional services; no new public ports. Enable profiles only after setup.
services:
  celery:
    profiles: [jobs]
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    command: [celery, -A, config.celery:app, worker, --loglevel=INFO, --concurrency=1, --max-tasks-per-child=100]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: [media:/app/media]
    networks: [backend, edge]
  beat:
    profiles: [jobs]
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    command: [celery, -A, config.celery:app, beat, --loglevel=INFO, --pidfile=/tmp/beat.pid]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend, edge]
  meilisearch:
    profiles: [search]
    image: getmeili/meilisearch:v1.16
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-}
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MAX_INDEXING_MEMORY: 256Mb
      MEILI_MAX_INDEXING_THREADS: 1
    volumes: [search_data:/meili_data]
    networks: [backend]
  uptime-kuma:
    profiles: [monitoring]
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    ports: ['127.0.0.1:13001:3001']
    volumes: [uptime_data:/app/data]
    networks: [edge]
volumes:
  search_data:
  uptime_data:
